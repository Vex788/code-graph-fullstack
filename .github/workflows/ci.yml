name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint with ruff
        run: uv run --locked ruff check code_review_graph/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run mypy
        run: >-
          uv run --locked --with types-networkx
          mypy code_review_graph/ --ignore-missing-imports --no-strict-optional

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit security scan
        run: bandit -r code_review_graph/ -c pyproject.toml

  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check the VS Code reader can read what Python writes
        run: |
          python3 - <<'PY'
          import re, sys
          src = open('code_review_graph/migrations.py').read()
          block = re.search(r'MIGRATIONS:\s*dict\[.*?\]\s*=\s*\{([^}]+)\}', src).group(1)
          latest = max(int(k) for k in re.findall(r'(\d+):', block))
          compat = int(re.search(r'^READER_COMPAT\s*=\s*(\d+)', src, re.M).group(1))
          ts = open('code-review-graph-vscode/src/backend/sqlite.ts').read()
          supported = int(re.search(r'SUPPORTED_SCHEMA_VERSION\s*=\s*(\d+)', ts).group(1))
          print(f"Python LATEST_VERSION={latest} READER_COMPAT={compat}; "
                f"VSCode SUPPORTED_SCHEMA_VERSION={supported}")
          if not compat <= supported <= latest:
              print(f"::error::VSCode schema {supported} must be within "
                    f"[READER_COMPAT {compat}, LATEST {latest}]")
              sys.exit(1)
          PY
      - name: Check generated kind files are up to date
        run: python3 scripts/gen_kinds.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests with coverage
        run: >-
          uv run --locked pytest --tb=short -q --cov=code_review_graph
          --cov-report=term-missing --cov-fail-under=65

  google-embeddings:
    name: Google embeddings (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [google-embeddings, all]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install optional dependency set
        # pip's resolver chokes on the extras set (python-dateutil backtracking
        # spiral, 2026-09-28); the project resolves with uv everywhere else.
        run: |
          pip install -q uv
          uv pip install --system -e ".[${{ matrix.extra }}]"
      - name: Construct Google embedding provider
        run: python scripts/smoke_google_embeddings.py

  windows-native:
    name: Windows daemon and file handles
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run native daemon and resource-handle tests
        run: >-
          python -m pytest --tb=short -q
          tests/test_windows_compat.py
          tests/test_daemon.py
          tests/test_changes.py
          tests/test_communities.py
          tests/test_flows.py
          tests/test_graph.py
          tests/test_integration_v2.py
          tests/test_migrations.py
          tests/test_postprocessing.py
          tests/test_refactor.py
          tests/test_search.py
          tests/test_tools.py
          tests/test_wiki.py
          tests/test_skills.py::TestInstallCodexHooks
          tests/test_skills.py::TestInstallCursorHooks

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install extension dependencies
        working-directory: code-review-graph-vscode
        run: npm ci
      - name: Compile extension and tests
        working-directory: code-review-graph-vscode
        run: npm run compile && npm run compile:tests
      - name: Run activation tests (Linux)
        if: runner.os == 'Linux'
        working-directory: code-review-graph-vscode
        run: xvfb-run -a node test/run-activation.mjs
      - name: Run activation tests (Windows)
        if: runner.os == 'Windows'
        working-directory: code-review-graph-vscode
        run: node test/run-activation.mjs

  vscode-extension-1-115:
    name: VS Code 1.115.0 activation (#218)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install extension dependencies
        working-directory: code-review-graph-vscode
        run: npm ci
      - name: Compile extension and tests
        working-directory: code-review-graph-vscode
        run: npm run compile && npm run compile:tests
      - name: Run activation tests on VS Code 1.115.0
        working-directory: code-review-graph-vscode
        env:
          CRG_VSCODE_VERSION: "1.115.0"
        run: xvfb-run -a node test/run-activation.mjs

  vsix:
    name: Packaged VSIX activates (#218)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install extension dependencies
        working-directory: code-review-graph-vscode
        run: npm ci
      - name: Package VSIX
        working-directory: code-review-graph-vscode
        run: npx vsce package --out crg.vsix
      - name: Verify VSIX contents
        working-directory: code-review-graph-vscode
        run: |
          unzip -l crg.vsix | grep -q 'extension/dist/extension.js'
          unzip -l crg.vsix | grep -q 'extension/dist/webview/graph.js'
          # The fixed build ships no native addon, so no Electron ABI to match.
          if unzip -l crg.vsix | grep -q '\.node$'; then
            echo "::error::native module found in VSIX"
            exit 1
          fi
      - name: Run activation tests against the packaged VSIX
        working-directory: code-review-graph-vscode
        run: |
          npm run compile:tests
          mkdir -p /tmp/crg-ext
          unzip -q crg.vsix -d /tmp/crg-ext
          CRG_EXTENSION_DIR=/tmp/crg-ext/extension xvfb-run -a node test/run-activation.mjs
