name: Release

# Fork versions carry a local segment (2.3.8+fs.N), which PyPI rejects, so a
# tag builds the sdist and wheel and attaches them to a GitHub release instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes
          $([[ "$GITHUB_REF_NAME" == *-rc* ]] && echo --prerelease)
