[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-graph-fullstack"
version = "2.3.8+fs.10"
description = "Fork of code-review-graph: fullstack code mapping (templates, routes, ORM) for AI review agents"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Tirth" },
    { name = "Vadim Yakovets [Vex788]", email = "vyakovets@plexsupply.com" },
]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "mcp", "ai-coding-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0,<3",
    # fastmcp >=3.2.4 is required for Message-based prompts and includes the
    # CVE-2025-62800/62801/66416 fixes. 4.x is verified (prompts.py imports
    # Message via a shim); <5 blocks the next unverified major. See: #488
    "fastmcp>=3.2.4,<5",
    "tree-sitter>=0.23.0,<1",
    # 1.x downloads grammars at runtime and changes the exception types.
    "tree-sitter-language-pack>=0.3.0,<2",
    "pyyaml>=6.0,<7",
    "networkx>=3.2,<4",
    "watchdog>=4.0.0,<7",
    "tomli>=2.0.0,<3; python_version < '3.11'",
    # balanced embeddings (EmbeddingGemma on MLX) work out of the box on Apple Silicon
    "mlx-embeddings>=0.1.0,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.0,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",  # mlx-embeddings' gemma3 imports it
    "numpy>=1.26,<3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/Vex788/code-graph-fullstack"
Repository = "https://github.com/Vex788/code-graph-fullstack"
Documentation = "https://github.com/Vex788/code-graph-fullstack/blob/develop/docs/INDEX.md"
Changelog = "https://github.com/Vex788/code-graph-fullstack/blob/develop/CHANGELOG.md"
Issues = "https://github.com/Vex788/code-graph-fullstack/issues"

[project.scripts]
code-review-graph = "code_review_graph.cli:main"
crg-daemon = "code_review_graph.daemon_cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0,<7",
    "numpy>=1.26,<3",
]
# Embedding profiles (`code-review-graph embeddings enable --profile P`).
# fast: static model2vec vectors, numpy only.
embeddings-fast = [
    "model2vec>=0.6.0,<1",
    "numpy>=1.26,<3",
]
# balanced on every OS: EmbeddingGemma through ONNX Runtime.
embeddings-onnx = [
    "fastembed>=0.8.0,<1",
    "numpy>=1.26,<3",
]
# balanced/accurate on Apple Silicon; resolves to nothing elsewhere.
embeddings-mlx = [
    "mlx-embeddings>=0.1.0,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.0,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26,<3",
]
google-embeddings = [
    "google-genai>=1.0.0,<3",
]
communities = [
    "igraph>=0.11.0",
]
eval = [
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]
wiki = [
    "ollama>=0.1.0",
]
all = [
    "code-graph-fullstack[embeddings]",
    "code-graph-fullstack[embeddings-fast]",
    "code-graph-fullstack[embeddings-onnx]",
    "code-graph-fullstack[embeddings-mlx]",
    "code-graph-fullstack[google-embeddings]",
    "code-graph-fullstack[communities]",
    "code-graph-fullstack[enrichment]",
    "code-graph-fullstack[eval]",
    "code-graph-fullstack[wiki]",
]
enrichment = [
    "jedi>=0.19.2",
]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["code_review_graph"]

[tool.hatch.build.targets.sdist]
include = [
    "code_review_graph/",
    "skills/",
    "docs/",
    "hooks/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "diagrams/",  # diagram DSL scripts — intentionally compact, non-standard style
    "tests/fixtures/sample_databricks_notebook.ipynb",  # SQL/R/Scala cells are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"code_review_graph/visualization.py" = ["E501"]  # embedded HTML/JS template
"code_review_graph/_legacy_instructions.py" = ["E501"]  # verbatim past output, must not be reflowed
"tests/fixtures/sample_databricks_export.py" = ["F841", "W292"]  # intentional fixture patterns
"tests/fixtures/sample_notebook.ipynb" = ["F401", "I001"]  # fixture imports: intentionally unused, split across cells
"tests/test_multilang.py" = ["E501"]  # long assertions with explanatory comments

[tool.bandit]
# B101: assert used (fine in non-security code)
# B404: import subprocess (we need git interaction)
# B603: subprocess without shell=True (we use list args, not shell)
# B607: partial executable path (calling "git" by name is standard)
# B608: SQL f-string — false positive, we use parameterized "?" placeholders on a local SQLite DB
skips = ["B101", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23,<2",
]
